<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="RoccoPlay - Watch Movies, Web Series, Dramas & Short Films Online.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="RoccoPlay">
  <link rel="apple-touch-icon" sizes="192x192" href="icons/Icon-192.png">

  <!-- Favicon for Google Search & Browsers (multiple of 48px required by Googlebot) -->
  <link rel="icon" type="image/png" sizes="192x192" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
  <link rel="shortcut icon" href="favicon.png">

  <!-- Open Graph / SEO -->
  <meta property="og:title" content="RoccoPlay">
  <meta property="og:description" content="Watch Movies, Web Series, Dramas & Short Films Online.">
  <meta property="og:image" content="icons/Icon-512.png">
  <meta property="og:url" content="https://roccoplay.in/">
  <meta property="og:type" content="website">

  <!-- Google AdSense -->
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4529616898084985" crossorigin="anonymous"></script>

  <title>RoccoPlay - Watch Movies, Web Series & Dramas</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script>
    function checkoutRazorpay(options, onSuccess, onFailure) {
      options.handler = function(response) {
        onSuccess(response.razorpay_payment_id, response.razorpay_order_id, response.razorpay_signature);
      };
      options.modal = {
        ondismiss: function() {
          onFailure("Payment Cancelled");
        }
      };
      var rzp = new Razorpay(options);
      rzp.open();
    }
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
